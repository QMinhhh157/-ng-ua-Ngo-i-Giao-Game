h1,h2,h3,.disp{font-family:'Baloo 2',system-ui,sans-serif;}
.hidden{display:none !important;}
button{font-family:inherit;}

.scenery{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.scenery::before{content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(247,240,201,.05) 0 43%,rgba(229,195,93,.14) 58%,rgba(81,95,45,.17) 100%),
    radial-gradient(circle at 14% 12%,rgba(255,242,166,.34),transparent 18%),
    radial-gradient(circle at 83% 16%,rgba(255,255,255,.20),transparent 24%);}
.scenery::after{content:"";position:absolute;inset:0;
  box-shadow:inset 0 0 120px rgba(26,45,30,.26),inset 0 -85px 110px rgba(76,47,20,.18);}
.sun{position:absolute;top:6%;left:8%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,187,.96) 0 23%,rgba(255,218,96,.55) 42%,transparent 72%);
  filter:blur(.2px);box-shadow:0 0 85px 28px rgba(255,221,100,.24);}
.hill{position:absolute;left:-8%;right:-8%;height:23%;bottom:34%;background:var(--leaf);opacity:.18;
  clip-path:polygon(0 74%,8% 63%,17% 69%,28% 43%,40% 63%,52% 35%,63% 58%,77% 30%,88% 60%,100% 45%,100% 100%,0 100%);}
.hill.h2{bottom:28%;background:var(--bamboo-d);opacity:.14;
  clip-path:polygon(0 72%,11% 49%,23% 67%,37% 42%,50% 61%,64% 38%,77% 63%,88% 46%,100% 62%,100% 100%,0 100%);}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.45;animation:drift linear infinite;filter:blur(.2px);}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%;}
.cloud.c1{width:120px;height:32px;top:8%;left:-14%;animation-duration:52s;}
.cloud.c1:before{width:54px;height:54px;top:-24px;left:12px;}
.cloud.c1:after{width:38px;height:38px;top:-16px;left:52px;}
.cloud.c2{width:80px;height:24px;top:15%;left:35%;animation-duration:66s;}
.cloud.c2:before{width:38px;height:38px;top:-17px;left:8px;}
.cloud.c2:after{width:28px;height:28px;top:-11px;left:38px;}
.cloud.c3{width:64px;height:19px;top:22%;left:72%;animation-duration:74s;}
.cloud.c3:before{width:30px;height:30px;top:-14px;left:6px;}
.bamboo-scene{position:absolute;inset:0;}
.bamboo-cluster{position:absolute;bottom:-4px;width:170px;height:360px;opacity:.82;filter:drop-shadow(0 10px 18px rgba(23,55,32,.22));}
.bamboo-cluster.left{left:-22px;transform:scaleX(.92);}
.bamboo-cluster.right{right:-22px;transform:scaleX(-.92);}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(130vw)}}

.btn{cursor:pointer;border:none;border-radius:11px;padding:11px 18px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;transition:transform .1s ease,filter .15s ease;}
.btn:hover{filter:brightness(1.04);}
.btn:active{transform:scale(.96);}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px;}
.btn.big{padding:16px 34px;font-size:19px;}
.btn-gold{background:linear-gradient(160deg,var(--gold-l),var(--gold));color:#2b2412;box-shadow:0 3px 0 #92701f;}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 #76231e;}
.btn-green{background:var(--green-soft);color:#17321e;box-shadow:0 3px 0 #4d7e45;}
.btn-outline{background:rgba(16,42,27,.58);border:1px solid rgba(255,226,135,.82);color:var(--gold-l);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.small{font-size:12px;opacity:.8;}

/* ===== Cover / start screen ===== */
.setup-cover{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
.cover-inner{background:transparent;border:none;border-radius:0;padding:18px 26px;box-shadow:none;max-width:760px;backdrop-filter:none;display:flex;flex-direction:column;align-items:center;gap:22px;}
.cover-title{font-size:clamp(44px,7vw,86px);margin:0;color:#FFF4C6;letter-spacing:1px;text-shadow:0 4px 0 rgba(41,56,26,.55),0 10px 28px rgba(24,39,22,.38);line-height:1.05;}
.cover-sub{display:none;}
.cover-inner .btn.big{min-width:210px;padding:14px 28px;font-size:20px;border-radius:999px;box-shadow:0 5px 0 #92701f,0 10px 22px rgba(35,47,25,.28);}
.cover-inner{animation:coverRise .8s cubic-bezier(.2,.8,.25,1) both;}
@keyframes coverRise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ===== Topbar ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(180deg,rgba(41,28,17,.96),rgba(52,29,17,.93));border-bottom:2px solid rgba(244,201,93,.85);z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.15);backdrop-filter:blur(8px);}
.topbar h1{font-size:19px;margin:0;color:var(--gold-l);letter-spacing:.4px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.meta{font-size:13px;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:999px;border:1px solid var(--gold);}

/* ===== Countryside game mat ===== */
.board-wrap{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:0;padding:10px 12px 14px;z-index:1;}
.board-grid{position:relative;height:100%;width:100%;overflow:hidden;border-radius:28px;
  background:
    linear-gradient(180deg,rgba(250,239,190,.16),rgba(236,205,120,.10)),
    repeating-linear-gradient(0deg,rgba(66,110,55,.035) 0 18px,rgba(255,248,212,.025) 18px 36px),
    rgba(245,236,198,.22);
  border:2px solid rgba(255,247,212,.84);
  box-shadow:0 14px 36px rgba(38,58,36,.30),inset 0 1px 0 rgba(255,255,255,.36);
  opacity:0;transform:scale(.975);transition:opacity .6s ease,transform .6s ease;backdrop-filter:blur(1.6px);}
.board-grid.show{opacity:1;transform:scale(1);}
.route-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible;pointer-events:none;}
.route-shadow{fill:none;stroke:rgba(74,55,26,.24);stroke-width:36;stroke-linecap:round;stroke-linejoin:round;transform:translateY(7px);}
.route-main{fill:none;stroke:#D7AF62;stroke-width:29;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 0 rgba(94,65,25,.22));}
.route-edge{fill:none;stroke:rgba(255,244,201,.94);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 12;}

.map-title{position:absolute;left:26px;top:17px;z-index:6;padding:9px 14px;border-radius:16px;
  background:rgba(31,75,48,.86);border:1px solid rgba(255,232,151,.72);color:#fff3c5;
  font-family:'Baloo 2';font-size:clamp(14px,1.65vw,19px);font-weight:800;letter-spacing:.5px;
  box-shadow:0 8px 20px rgba(29,57,34,.18);backdrop-filter:blur(6px);}
.map-hint{position:absolute;right:24px;top:19px;z-index:6;padding:7px 11px;border-radius:999px;
  background:rgba(255,250,226,.88);color:#315c3c;font-size:12px;font-weight:700;box-shadow:0 5px 14px rgba(50,66,30,.12);}
.map-stamp{position:absolute;left:2.8%;top:42%;z-index:3;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px dashed rgba(255,246,207,.78);color:rgba(255,246,207,.9);font-family:'Baloo 2';font-size:13px;font-weight:800;
  transform:rotate(-10deg);background:rgba(47,95,58,.12);}
.map-deco{position:absolute;z-index:2;pointer-events:none;filter:drop-shadow(0 5px 8px rgba(40,54,28,.16));}
.map-deco.rice{left:4%;bottom:14%;font-size:clamp(28px,3vw,48px);opacity:.76;}
.map-deco.house{right:5%;bottom:15%;font-size:clamp(28px,3vw,46px);opacity:.78;}
.map-deco.bamboo{right:4%;top:28%;font-size:clamp(34px,3.6vw,56px);opacity:.72;}
.map-deco.fan{left:44%;top:8%;font-size:clamp(22px,2vw,32px);opacity:.42;transform:rotate(-12deg);}
.map-deco.butterfly{left:28%;top:24%;font-size:clamp(18px,1.8vw,28px);opacity:.50;}

.cell{position:absolute;width:clamp(46px,4.55vw,66px);height:clamp(46px,4.55vw,66px);border-radius:18px;
  background:linear-gradient(145deg,#fffdf3,#f7e6bf);color:var(--ink);border:2px solid rgba(120,83,32,.42);
  box-shadow:0 6px 0 #b68a42,0 10px 15px rgba(43,57,30,.20),inset 0 1px 0 rgba(255,255,255,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(10px,.9vw,13px);overflow:visible;font-weight:800;
  transform:translate(-50%,-50%) rotate(var(--tilt,0deg));transition:filter .16s ease,box-shadow .16s ease,transform .16s ease;z-index:4;}
.cell:hover{filter:brightness(1.05) saturate(1.03);box-shadow:0 7px 0 #b68a42,0 14px 19px rgba(43,57,30,.24),inset 0 1px 0 rgba(255,255,255,.95);}
.cell .num{position:absolute;top:5px;left:7px;font-size:10px;opacity:.48;font-family:'Baloo 2';z-index:2;}
.cell .deco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,2vw,27px);opacity:.23;pointer-events:none;filter:saturate(.72);}
.cell.special{background:linear-gradient(145deg,#fff0ae,#efca6c);border-color:#d39b30;
  box-shadow:0 6px 0 #9d6c18,0 0 0 4px rgba(233,196,93,.16),0 12px 18px rgba(43,57,30,.21),inset 0 1px 0 rgba(255,255,255,.85);}
.cell.special .icon{font-size:clamp(19px,2.1vw,29px);z-index:2;filter:drop-shadow(0 2px 1px rgba(0,0,0,.22));}
.cell.start{width:clamp(72px,7vw,104px);height:clamp(72px,7vw,104px);border-radius:28px;background:linear-gradient(160deg,#6FA96D,#2F6D48);
  color:#fff;font-weight:900;border:3px solid rgba(255,243,187,.94);box-shadow:0 8px 0 #24553a,0 15px 23px rgba(36,57,32,.28),inset 0 1px 0 rgba(255,255,255,.38);z-index:7;}
.cell.start .num{opacity:.65;color:#fff;}
.cell.finish{width:clamp(80px,7.9vw,116px);height:clamp(80px,7.9vw,116px);border-radius:32px;background:linear-gradient(160deg,#fff0ae,#e4a838);
  color:#2b210b;font-weight:900;border:3px solid rgba(255,247,211,.96);box-shadow:0 9px 0 #9f711b,0 0 25px rgba(255,225,119,.64),0 16px 26px rgba(43,57,30,.23),inset 0 1px 0 rgba(255,255,255,.8);animation:glow 2s ease-in-out infinite;z-index:7;}
.cell.finish .num{opacity:.58;}
@keyframes glow{0%,100%{box-shadow:0 9px 0 #9f711b,0 0 13px rgba(255,225,119,.52),0 16px 26px rgba(43,57,30,.22)}50%{box-shadow:0 9px 0 #9f711b,0 0 33px rgba(255,225,119,.96),0 16px 26px rgba(43,57,30,.19)}}

.tokens{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;z-index:5;}
.tok{width:clamp(30px,2.9vw,42px);height:clamp(30px,2.9vw,42px);border-radius:14px;display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(255,250,220,.96);box-shadow:0 4px 7px rgba(33,51,30,.32),inset 0 1px 1px rgba(255,255,255,.65);
  transition:all .3s ease;position:relative;font-size:clamp(18px,2vw,25px);line-height:1;background:linear-gradient(145deg,#fff3c9,var(--team-color));}
.tok::after{content:attr(data-team);position:absolute;right:-5px;bottom:-5px;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bamboo-d);border:1.5px solid #fff4cf;color:#fff7de;font:700 10px/1 'Baloo 2';box-shadow:0 2px 4px rgba(0,0,0,.22);}
.team-avatar{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:linear-gradient(145deg,#fff0c1,var(--team-color));border:2px solid rgba(255,249,218,.95);box-shadow:0 2px 5px rgba(0,0,0,.28);font-size:22px;line-height:1;}

@media(max-width:820px){
  .reopen-q{right:10px;bottom:10px;padding:6px 10px;font-size:11px;}
  .dock{left:10px;bottom:10px;} .dock .dock-action{padding:7px 10px!important;font-size:11px!important;} .dock-msg{font-size:11px;padding:6px 9px;}
  .dock.end-ready{left:auto;right:10px;bottom:54px;}
  .effects-grid{grid-template-columns:1fr;}
  .turn-transition-sub{margin-top:10px;}
  .topbar{padding:0 10px}.topbar h1{font-size:14px}.meta{display:none}.opts{grid-template-columns:1fr;}
  .board-wrap{padding:7px 7px 10px}.board-grid{border-radius:20px}.map-title{left:12px;top:9px;font-size:12px;padding:7px 10px}.map-hint{right:12px;top:10px;font-size:10px;padding:6px 9px}.map-stamp{display:none}
  .map-deco{transform:scale(.78)} .map-deco.rice{left:2%;bottom:12%}.map-deco.house{right:2%;bottom:13%}.map-deco.bamboo{right:1%;top:26%}
  .cell{width:38px;height:38px;border-radius:13px}.cell.special .icon{font-size:18px}.cell.start{width:55px;height:55px;border-radius:18px}.cell.finish{width:62px;height:62px;border-radius:21px}.tok{width:29px;height:29px;font-size:17px}.team-avatar{width:29px;height:29px;font-size:18px}
  .dice-ready-scene{width:128px;height:128px}.dice-ready-scene .face{width:128px;height:128px;border-radius:20px;padding:18px}.dice-ready-scene .dice-pip,.dice-ready-scene .dice-pip.on{width:22px;height:22px}.dice-ready-label{font-size:14px}
}

/* ===== Score drawer ===== */
.score-drawer{position:fixed;top:var(--topbar-h);right:0;bottom:0;width:300px;background:linear-gradient(180deg,rgba(27,55,36,.97),rgba(39,68,44,.95));
  border-left:2px solid var(--gold);z-index:25;padding:16px;transform:translateX(0);transition:transform .28s ease;overflow:auto;}
.score-drawer.hidden{transform:translateX(100%);display:block !important;}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.drawer-head h3{margin:0;color:var(--gold-l);}
.team-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(212,175,87,.2);font-size:14px;}
.team-row:last-child{border-bottom:none;}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.5);}
.team-row .name{flex:1;font-weight:600;}
.team-row .sc{font-family:'Baloo 2';font-weight:700;color:var(--gold-l);}
.team-row .pos{font-size:11px;opacity:.7;}
.badge{font-size:10px;background:var(--gold);color:#241a04;border-radius:5px;padding:1px 5px;margin-left:4px;}

/* ===== Dock ===== */
.dock{position:fixed;bottom:14px;left:14px;z-index:22;
  background:transparent;border:none;padding:0;display:flex;align-items:center;gap:8px;pointer-events:none;}
.dock>*{pointer-events:auto;}
.dock-msg{font-size:12px;color:#fff7d6;background:rgba(32,52,35,.88);border:1px solid rgba(244,201,93,.7);border-radius:999px;padding:7px 10px;box-shadow:0 6px 14px rgba(0,0,0,.22);backdrop-filter:blur(7px);}
.dock .dock-action{padding:8px 12px!important;font-size:12px!important;border-radius:999px!important;box-shadow:0 6px 14px rgba(57,66,25,.24)!important;}
.dock.end-ready{left:auto;right:14px;bottom:54px;}

.reset-turn-btn{padding:7px 11px!important;font-size:12px!important;border-radius:999px!important;}

.dice-overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,20,15,.68);backdrop-filter:blur(3px);}
.dice-ready-overlay{position:fixed;inset:0;z-index:61;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,20,15,.20);pointer-events:auto;}
.dice-ready-overlay.hidden{display:none;}
.dice-ready-inner{display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;user-select:none;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.28));animation:diceBob 1.8s ease-in-out infinite;}
.dice-ready-inner:hover{transform:scale(1.045);}
.dice-ready-label{font:800 16px/1.2 'Baloo 2',sans-serif;color:#fff6d4;text-shadow:0 3px 10px rgba(0,0,0,.45);}
@keyframes diceBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.dice-scene{perspective:650px;width:120px;height:120px;}
.dice-ready-scene{perspective:850px;width:168px;height:168px;}
.dice-ready-scene .cube{transform:rotateX(-16deg) rotateY(24deg) rotateZ(-2deg) scale(1.2);}
.dice-ready-scene .face{width:168px;height:168px;border-radius:24px;padding:22px;}
.dice-ready-scene .dice-pip{width:28px;height:28px;}
.dice-ready-scene .dice-pip.on{width:28px;height:28px;}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(0deg) rotateY(0deg);}
.face{position:absolute;width:120px;height:120px;background:linear-gradient(160deg,#fff,#e8e0cd);border:3px solid var(--wood);
  border-radius:18px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;box-sizing:border-box;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.6);}
.dice-pip{width:22px;height:22px;border-radius:50%;background:transparent;justify-self:center;align-self:center;}
.dice-pip.on{background:#2F281D;width:22px;height:22px;box-shadow:inset 0 2px 3px rgba(0,0,0,.28),0 1px 1px rgba(255,255,255,.12);}
.f1{transform:translateZ(60px);} .f6{transform:rotateY(180deg) translateZ(60px);}
.f3{transform:rotateY(90deg) translateZ(60px);} .f4{transform:rotateY(-90deg) translateZ(60px);}
.f5{transform:rotateX(90deg) translateZ(60px);} .f2{transform:rotateX(-90deg) translateZ(60px);}
.dice-result{margin-top:24px;font-family:'Baloo 2';font-size:21px;color:var(--gold-l);text-align:center;}

/* ===== Question panel ===== */
.q-panel{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:min(780px,92vw);max-height:62vh;overflow:auto;
  background:linear-gradient(150deg,rgba(34,30,24,.95),rgba(54,41,26,.95));border:1px solid rgba(244,201,93,.86);border-radius:20px;padding:18px 20px;z-index:24;
  box-shadow:0 18px 40px rgba(0,0,0,.42);backdrop-filter:blur(10px);}
.q-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.turn{font-family:'Baloo 2';color:var(--gold-l);font-size:15px;}
.qtext{font-size:16px;line-height:1.5;margin:6px 0 14px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
.opt{background:linear-gradient(155deg,#fffdf6,#f8ead1);color:var(--ink);border-radius:13px;padding:11px 14px;font-size:14px;border:2px solid transparent;
  cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
.opt:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.25);}
.opts.locked .opt{cursor:default;pointer-events:none;}
.opts.locked .opt:hover{transform:none;}
.opt.correct-reveal{border-color:var(--green-soft);background:#dff2e4;font-weight:700;}
.opt.wrong-pick{border-color:var(--red);background:#f7d9d9;}
.opt .lab{font-weight:700;color:var(--red);margin-right:6px;}
.controls{font-size:13px;opacity:.85;margin-bottom:4px;}
.steal-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--gold);background:var(--panel2);cursor:pointer;font-size:13px;}
.pill:hover{background:var(--gold);color:#241a04;}
.reopen-q{position:fixed;right:16px;bottom:14px;left:auto;transform:none;z-index:23;border-radius:999px;
  background:rgba(232,192,82,.95);color:#2b210b;border:1px solid rgba(255,246,205,.9);padding:7px 12px;
  font-family:'Baloo 2';font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 6px 14px rgba(37,44,24,.24);backdrop-filter:blur(7px);}
.reopen-q:hover{transform:translateY(-1px);filter:brightness(1.04);}

.effects-btn{padding:7px 11px!important;font-size:12px!important;border-radius:999px!important;}

/* ===== Active effects panel ===== */
.effects-overlay{position:fixed;inset:0;z-index:68;background:rgba(10,22,14,.58);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;}
.effects-overlay.hidden{display:none;}
.effects-panel{width:min(720px,94vw);max-height:82vh;overflow:auto;background:linear-gradient(155deg,#fff9e7,#f1e2bd);color:var(--ink);border:4px solid rgba(200,168,92,.95);border-radius:22px;box-shadow:0 24px 55px rgba(0,0,0,.30);padding:22px;}
.effects-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.effects-head h2{margin:0;font-size:26px;color:#315b3d;}
.effects-sub{margin:3px 0 0;font-size:12px;opacity:.7;}
.effects-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.effect-team{background:rgba(255,255,255,.62);border:1px solid rgba(95,141,78,.25);border-radius:16px;padding:12px 13px;box-shadow:0 5px 12px rgba(56,73,42,.10);}
.effect-team-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.effect-team-head .team-avatar{width:38px;height:38px;font-size:24px;}
.effect-list{display:flex;flex-direction:column;gap:7px;}
.effect-chip{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(46,107,67,.08);border:1px dashed rgba(46,107,67,.22);}
.effect-chip .icon{font-size:18px;line-height:1.1;}
.effect-chip b{display:block;font-size:12px;color:#2e5f3d;}
.effect-chip span{display:block;font-size:11px;line-height:1.35;opacity:.78;margin-top:2px;}
.effect-none{font-size:12px;opacity:.56;padding:7px 2px;}

/* ===== Turn transition ===== */
.turn-transition{position:fixed;inset:0;z-index:74;display:flex;align-items:center;justify-content:center;text-align:center;
  background:rgba(19,35,24,.60);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .24s ease;padding:20px;}
.turn-transition.show{opacity:1;pointer-events:auto;}
.turn-transition-inner{transform:translateY(10px) scale(.96);transition:transform .28s ease;display:flex;flex-direction:column;align-items:center;}
.turn-transition.show .turn-transition-inner{transform:translateY(0) scale(1);}
.turn-transition-avatar{width:clamp(84px,11vw,122px);height:clamp(84px,11vw,122px);display:flex;align-items:center;justify-content:center;
  font-size:clamp(56px,8vw,90px);line-height:1;margin-bottom:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,249,211,.98),rgba(255,234,169,.90) 56%,rgba(208,167,73,.90) 100%);
  border:4px solid rgba(255,248,211,.95);box-shadow:0 12px 24px rgba(34,50,27,.26),inset 0 2px 0 rgba(255,255,255,.75);
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));position:relative;z-index:2;}
.turn-transition-title{font:800 clamp(40px,7vw,88px)/.98 'Baloo 2',sans-serif;color:#fff4bc;letter-spacing:1px;text-shadow:0 6px 0 rgba(74,45,20,.42),0 12px 28px rgba(0,0,0,.28);position:relative;z-index:1;}
.turn-transition-sub{margin-top:14px;font:700 clamp(15px,2.2vw,23px)/1.2 'Be Vietnam Pro',sans-serif;color:#fffaf0;text-shadow:0 2px 6px rgba(0,0,0,.3);}

/* ===== Round score overlay ===== */
.round-score-overlay{position:fixed;inset:0;z-index:72;background:rgba(13,25,17,.60);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;}
.round-score-overlay.hidden{display:none;}
.round-score-panel{width:min(760px,94vw);max-height:86vh;overflow:auto;background:linear-gradient(155deg,#fff9e7,#f1e2bd);color:var(--ink);border:5px solid rgba(200,168,92,.95);border-radius:24px;box-shadow:0 28px 62px rgba(0,0,0,.34);padding:26px;}
.round-score-title{text-align:center;margin:0;color:#315b3d;font-size:clamp(28px,4vw,40px);}
.round-score-sub{text-align:center;font-size:13px;opacity:.68;margin:5px 0 17px;}
.round-score-list{display:flex;flex-direction:column;gap:9px;}
.round-score-row{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.64);border:1px solid rgba(95,141,78,.25);border-radius:15px;padding:10px 13px;}
.round-score-row .place{width:34px;font:800 24px/1 'Baloo 2';color:#8b6a28;text-align:center;}
.round-score-row .team-avatar{width:44px;height:44px;font-size:27px;}
.round-score-row .team-main{flex:1;min-width:0;}
.round-score-row .team-name{font-weight:800;font-size:15px;}
.round-score-row .team-detail{font-size:11px;opacity:.64;margin-top:2px;}
.round-score-row .team-score{font:800 22px/1 'Baloo 2';color:#315b3d;}
.round-score-actions{display:flex;justify-content:center;margin-top:18px;}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(20,12,4,.68);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:linear-gradient(155deg,#fff9e7,#f5e8c7);color:var(--ink);border-radius:16px;max-width:440px;width:100%;padding:26px;text-align:center;border:6px double #C8A85C;box-shadow:0 20px 48px rgba(31,49,31,.25);}
.modal .tag{display:inline-block;font-size:11px;letter-spacing:1px;background:var(--red);color:#fff;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.modal .tag.loi{background:var(--green-soft);color:#0d1f14;}
.modal .tag.dac{background:var(--gold);color:#241a04;}
.modal .tag.trang{background:#999;color:#fff;}
.modal h2{margin:4px 0 10px;font-size:22px;}
.modal p{font-size:15px;line-height:1.5;}
.modal-actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.card-stack{position:relative;width:132px;height:164px;margin:0 auto 10px;perspective:900px;}
.card-back{position:absolute;left:50%;top:50%;width:92px;height:128px;margin:0;border-radius:13px;
  background:linear-gradient(155deg,#567a4d,#294934);border:3px solid #e3c56e;display:flex;align-items:center;justify-content:center;
  box-shadow:0 9px 16px rgba(27,44,27,.28),inset 0 1px 0 rgba(255,255,255,.55);

/* Ready-to-roll die: use the same 3D geometry as the actual thrown die, but larger. */
.dice-ready-inner{gap:0;}
.dice-ready-inner:hover{transform:scale(1.035);}
.dice-ready-scene{
  perspective:1050px;
  width:190px;height:190px;
  filter:drop-shadow(0 22px 28px rgba(16,31,19,.34));
}
.dice-ready-scene .cube{
  width:190px;height:190px;
  transform:rotateX(-22deg) rotateY(34deg) rotateZ(-3deg);
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.10));
}
.dice-ready-scene .face{
  width:190px;height:190px;
  padding:24px;
  border-radius:30px;
  border:4px solid #7b522e;
  background:
    linear-gradient(145deg,#ffffff 0%,#fbf8ee 38%,#e9e0ce 100%);
  box-shadow:
    inset 5px 5px 10px rgba(255,255,255,.95),
    inset -8px -10px 16px rgba(129,104,71,.16),
    0 1px 0 rgba(255,255,255,.8);
}
.dice-ready-scene .dice-pip,
.dice-ready-scene .dice-pip.on{
  width:31px;height:31px;
}
.dice-ready-scene .dice-pip.on{
  background:radial-gradient(circle at 34% 30%,#403629 0%,#2b241d 48%,#171310 100%);
  box-shadow:
    inset 2px 3px 4px rgba(255,255,255,.08),
    inset -2px -2px 3px rgba(0,0,0,.45),
    0 1px 2px rgba(0,0,0,.26);
}
/* The original 120px die uses 60px half-depth. The ready die is 190px, so its half-depth is 95px. */
.dice-ready-scene .f1{transform:translateZ(95px);}
.dice-ready-scene .f6{transform:rotateY(180deg) translateZ(95px);}
.dice-ready-scene .f3{transform:rotateY(90deg) translateZ(95px);}
.dice-ready-scene .f4{transform:rotateY(-90deg) translateZ(95px);}
.dice-ready-scene .f5{transform:rotateX(90deg) translateZ(95px);}
.dice-ready-scene .f2{transform:rotateX(-90deg) translateZ(95px);}
.dice-ready-label{display:none!important;}

/* ===== Ready-to-roll die: same real 3D cube as the thrown die ===== */
.dice-ready-overlay{
  background:rgba(14,24,15,.26);

}

  position:relative;

.dice-ready-inner:hover{transform:scale(1.035);}
.dice-ready-scene{
  position:relative;

  perspective:900px;

}
.dice-ready-scene .cube{

}
.dice-ready-scene .face{

  padding:22px;

  background:linear-gradient(145deg,#fffefa 0%,#f7f2e6 48%,#e4dac8 100%);

  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  backface-visibility:visible;
  box-shadow:
    inset 4px 4px 8px rgba(255,255,255,.95),
    inset -7px -9px 14px rgba(107,84,51,.14),
    0 1px 0 rgba(255,255,255,.8);
}
.dice-ready-scene .dice-pip,
.dice-ready-scene .dice-pip.on{
  width:28px;height:28px;
  justify-self:center;align-self:center;
}
.dice-ready-scene .dice-pip.on{
  background:radial-gradient(circle at 33% 30%,#4a4034 0%,#2c261f 48%,#17130f 100%);
  box-shadow:
    inset 2px 3px 4px rgba(255,255,255,.08),
    inset -2px -2px 3px rgba(0,0,0,.45),
    0 1px 2px rgba(0,0,0,.24);
}
.dice-ready-scene .f1{transform:translateZ(85px);}
.dice-ready-scene .f6{transform:rotateY(180deg) translateZ(85px);}
.dice-ready-scene .f3{transform:rotateY(90deg) translateZ(85px);}
.dice-ready-scene .f4{transform:rotateY(-90deg) translateZ(85px);}
.dice-ready-scene .f5{transform:rotateX(90deg) translateZ(85px);}
.dice-ready-scene .f2{transform:rotateX(-90deg) translateZ(85px);}
.dice-ready-floor{
  position:absolute;
  left:50%;bottom:18px;
  width:175px;height:34px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(29,20,12,.32) 0%,rgba(29,20,12,.13) 46%,rgba(29,20,12,0) 74%);
  filter:blur(5px);
  pointer-events:none;
}
.dice-ready-label{display:none!important;}

<script>
const Q = [{"q": "Ai là người đã phát triển khẩu hiệu \"Công nhân toàn thế giới hãy liên hiệp lại!\" thành \"Vô sản toàn thế giới và các dân tộc bị áp bức đoàn kết lại!\"?", "o": ["C. Mác", "Ph. Ăngghen", "V.I. Lênin", "Hồ Chí Minh"], "c": 2}, {"q": "Hình ảnh ẩn dụ \"con đỉa hai vòi\" của Lênin dùng để chỉ điều gì?", "o": ["Sự liên minh giữa phong trào công nhân và phong trào nông dân", "Bản chất bóc lột của chủ nghĩa tư bản, đế quốc đối với cả vô sản chính quốc và nhân dân thuộc địa", "Hai khuynh hướng chính trị đối lập trong Quốc tế Cộng sản", "Mối quan hệ giữa sức mạnh dân tộc và sức mạnh thời đại"], "c": 1}, {"q": "Giá trị cốt lõi nào trong văn hóa truyền thống dân tộc Việt Nam đã được Hồ Chí Minh kế thừa để phát triển thành nghệ thuật đối ngoại của mình?", "o": ["Tư tưởng bế quan tỏa cảng", "Truyền thống đoàn kết, hòa hiếu, \"thêm bạn bớt thù\"", "Tư tưởng dân tộc cực đoan", "Triết lý thoát tục, lánh đời"], "c": 1}, {"q": "Khi tiếp thu Tuyên ngôn Độc lập năm 1776 của Mỹ và Tuyên ngôn Nhân quyền và Dân quyền năm 1791 của Pháp, Hồ Chí Minh đã có sự phát triển sáng tạo nào?", "o": ["Phủ nhận hoàn toàn các giá trị tư sản phương Tây", "Nâng tầm quyền tự do của con người cá nhân thành quyền độc lập, tự quyết thiêng liêng của các dân tộc bị áp bức", "Chỉ áp dụng cho các quốc gia châu Á", "Đồng nhất quyền con người với quyền lợi của giai cấp tư sản"], "c": 1}, {"q": "Yêu cầu khách quan nào của cách mạng Việt Nam đòi hỏi bắt buộc phải kết hợp sức mạnh dân tộc với sức mạnh thời đại?", "o": ["Do Việt Nam muốn trở thành cường quốc quân sự khu vực", "Do kẻ thù xâm lược là các đế quốc lớn mạnh mang tính chất quốc tế, trong khi Việt Nam là nước nhỏ, kinh tế nghèo nàn", "Do yêu cầu chỉ định từ Quốc tế Cộng sản", "Do các nước phương Tây chủ động viện trợ không điều kiện"], "c": 1}, {"q": "Hồ Chí Minh đã sử dụng hình ảnh ẩn dụ nào để khẳng định mối quan hệ khăng khít, bình đẳng giữa cách mạng thuộc địa và cách mạng vô sản ở chính quốc?", "o": ["Cây và lá", "Hai cánh của một con chim", "Nước với thuyền", "Con tàu và đường ray"], "c": 1}, {"q": "Trong câu nói nổi tiếng của Bác: \"Thực lực là cái chiêng mà ngoại giao là cái tiếng. Chiêng có to tiếng mới lớn\", Người muốn nhấn mạnh điều gì?", "o": ["Hoạt động ngoại giao quan trọng hơn phát triển kinh tế", "Nội lực (thực lực trong nước) giữ vai trò quyết định, là cơ sở cho thắng lợi ngoại giao", "Cần hoàn toàn trông chờ vào sự viện trợ của bên ngoài", "Ngoại giao chỉ cần tài ăn nói, không cần sức mạnh nội tại"], "c": 1}, {"q": "Đâu là nét đặc sắc thể hiện tính nhân văn trong tư tưởng phân định \"bạn - thù\" của Hồ Chí Minh?", "o": ["Coi toàn bộ công dân nước đi xâm lược đều là kẻ thù", "Phân biệt rạch ròi giữa chính quyền thực dân/đế quốc xâm lược với nhân dân lao động yêu chuộng hòa bình ở chính các nước đó", "Không phân biệt bạn và thù, thỏa hiệp với tất cả", "Chỉ làm bạn với các quốc gia châu Á láng giềng"], "c": 1}, {"q": "Việc Chủ tịch Hồ Chí Minh chủ động ký Hiệp định Sơ bộ (6/3/1946) và Tạm ước (14/9/1946) với Pháp là minh chứng lịch sử tiêu biểu cho phương châm ngoại giao nào?", "o": ["Bế quan tỏa cảng", "Dĩ bất biến, ứng vạn biến", "Cứng rắn trong mọi tình huống", "Chấp nhận đầu hàng vô điều kiện"], "c": 1}, {"q": "Bản chất cốt lõi của nghệ thuật \"Ngoại giao tâm công\" trong tư tưởng Hồ Chí Minh là gì?", "o": ["Dùng sức mạnh quân sự tuyệt đối để áp đảo đối phương", "Dùng vật chất, tiền bạc để mua chuộc lòng người", "Dùng chính nghĩa, đạo lý, lẽ phải và lòng nhân ái để cảm hóa, thuyết phục nhân tâm", "Sử dụng các biện pháp trừng phạt kinh tế"], "c": 2}, {"q": "Hình tượng “gốc vững” trong trường phái “Ngoại giao cây tre Việt Nam” tượng trưng cho điều gì?", "o": ["Sự linh hoạt trong phương thức xử lý các mối quan hệ quốc tế.", "Sự kiên định với độc lập, tự chủ, lợi ích quốc gia - dân tộc và các nguyên tắc cơ bản của luật pháp quốc tế.", "Bản lĩnh, năng lực tự chủ và khả năng giữ vững lập trường trước các biến động.", "Khả năng kết hợp hài hòa giữa đối ngoại chính trị và đối ngoại quốc phòng."], "c": 1}, {"q": "Hình tượng “thân chắc” và “cành uyển chuyển” phản ánh những đặc điểm nào của đường lối đối ngoại Việt Nam?", "o": ["“Thân chắc” tượng trưng cho lợi ích quốc gia; “cành uyển chuyển” tượng trưng cho luật pháp quốc tế.", "“Thân chắc” thể hiện tính hòa hiếu; “cành uyển chuyển” thể hiện tính tự lực tự cường.", "“Thân chắc” thể hiện bản lĩnh, năng lực tự chủ trước biến động; “cành uyển chuyển” thể hiện sự linh hoạt, mềm dẻo trong sách lược.", "“Thân chắc” là kiên định mục tiêu xã hội chủ nghĩa; “cành uyển chuyển” là đa dạng hóa quan hệ không cần nguyên tắc."], "c": 2}, {"q": "Phương châm nào trong tư tưởng Hồ Chí Minh là nguồn gốc trực tiếp cho triết lý kết hợp giữa tính “kiên định về nguyên tắc” và “linh hoạt về sách lược” của Ngoại giao cây tre?", "o": ["Thêm bạn bớt thù.", "Dĩ bất biến, ứng vạn biến.", "Độc lập, tự chủ đi đôi với biệt lập.", "Kết hợp sức mạnh dân tộc với sức mạnh thời đại."], "c": 1}, {"q": "Sự phát triển từ chủ trương “làm bạn với tất cả các nước” của tư tưởng Hồ Chí Minh sang thời kỳ hội nhập quốc tế hiện nay được thể hiện qua hành động cụ thể nào của nước ta?", "o": ["Chỉ duy trì quan hệ ngoại giao song phương truyền thống.", "Thiết lập mạng lưới quan hệ đa dạng và đa tầng nấc gồm các Đối tác chiến lược, Đối tác toàn diện và Đối tác chiến lược toàn diện.", "Chỉ tập trung hợp tác với các nước láng giềng Đông Nam Á.", "Đóng cửa nền kinh tế để tập trung phát triển tự cấp tự túc."], "c": 1}, {"q": "Trong bối cảnh hội nhập quốc tế toàn diện, Việt Nam đã có sự chuyển đổi quan trọng như thế nào tại các diễn đàn đa phương (như ASEAN, Liên Hợp Quốc, APEC)?", "o": ["Chuyển từ \"chủ động đóng góp\" sang chỉ \"tham gia\" để quan sát tình hình.", "Chuyển từ \"tham gia\" đơn thuần sang \"chủ động đóng góp và định hình\" các luật chơi chung phù hợp với khả năng và lợi ích của đất nước.", "Rút lui dần khỏi các tổ chức đa phương để giữ vững tuyệt đối sự độc lập.", "Chỉ tham gia khi có sự kêu gọi hoặc yêu cầu từ các cường quốc lớn."], "c": 1}, {"q": "Cột mốc ngoại giao nổi bật vào tháng 9/2023 thể hiện sự ứng biến linh hoạt, \"bỏ qua cấp trung gian\" trong đan xen lợi ích với các nước lớn của Ngoại giao cây tre là gì?", "o": ["Nâng cấp quan hệ lên Đối tác Chiến lược Toàn diện với Hàn Quốc.", "Nâng cấp quan hệ trực tiếp từ Đối tác Toàn diện lên Đối tác Chiến lược Toàn diện với Hoa Kỳ.", "Ký kết Hiệp định Đối tác Kinh tế Toàn diện Khu vực (RCEP).", "Trúng cử vào Hội đồng Nhân quyền Liên Hợp Quốc nhiệm kỳ 2023 - 2025."], "c": 1}, {"q": "Chính sách quốc phòng nào dưới đây được ví như nền tảng \"gốc vững\" để Việt Nam thực hiện mô hình \"cân bằng có nguyên tắc\", không chọn bên trong cạnh tranh nước lớn?", "o": ["Chính sách quốc phòng \"Bốn Không\".", "Chính sách đơn phương liên minh quân sự với các nước láng giềng.", "Chính sách bế quan tỏa cảng quân sự.", "Chính sách cho phép nước ngoài đặt căn cứ quân sự tại các cảng biển lớn."], "c": 0}, {"q": "Khái niệm \"Gốc vững\" của Ngoại giao cây tre được áp dụng như thế nào nhằm bảo vệ an ninh quốc gia trong kỷ nguyên số theo tinh thần độc lập tự chủ?", "o": ["Cho phép các tập đoàn công nghệ nước ngoài hoàn toàn kiểm soát dữ liệu.", "Không tham gia vào bất kỳ hoạt động thương mại điện tử quốc tế nào để tránh rủi ro.", "Bảo vệ chủ quyền dữ liệu và an ninh mạng quốc gia, yêu cầu các nền tảng xuyên biên giới tuân thủ luật pháp sở tại.", "Ngừng chuyển giao công nghệ cao từ bên ngoài để tự xây dựng hệ thống khép kín."], "c": 2}, {"q": "Việc đón tiếp liên tiếp nguyên thủ của Mỹ (tháng 9/2023), Trung Quốc (tháng 12/2023) và Nga (năm 2024) trong thời gian ngắn thể hiện năng lực thực tiễn nào của \"cành uyển chuyển\" trong Ngoại giao Cây tre?", "o": ["Đưa Việt Nam trở thành trung tâm liên minh quân sự mới của khu vực.", "Biến thách thức cạnh tranh giữa các nước lớn thành cơ hội hợp tác kinh tế - an ninh, tạo thế \"cân bằng chiến lược\".", "Buộc các cường quốc phải nhượng bộ hoàn toàn về mặt thương mại.", "Thể hiện sự thiên lệch chiến lược sang các đối tác phương Tây. Sự uyển chuyển giúp Việt Nam tạo ra \"điểm giao thoa\" lợi ích, nơi mọi cường quốc đều thấy có động cơ để hợp tác"], "c": 1}, {"q": "Dựa trên \"gốc vững\" là chính sách quốc phòng \"Bốn Không\", tính linh hoạt của ngoại giao Việt Nam được áp dụng vào thực tiễn quân sự qua hành động nào?", "o": ["Ký kết hiệp ước phòng thủ chung với các nước ASEAN.", "Cho phép nước ngoài đặt căn cứ quân sự tạm thời tại các đảo tiền tiêu.", "Đón các tàu hải quân nước ngoài đến thăm cảng Quốc tế Cam Ranh để bảo dưỡng hậu cần nhằm tăng nguồn thu kinh tế.", "Tham gia các cuộc tập trận tấn công quân sự quy mô lớn với các đối tác chiến lược. Hành động này thể hiện sự minh bạch, mang lại lợi ích kinh tế nhưng vẫn kiên quyết không bị lôi kéo vào liên minh quân sự"], "c": 2}, {"q": "Bước nhảy vọt thực tiễn khi linh hoạt nâng cấp quan hệ bỏ qua cấp trung gian lên Đối tác Chiến lược Toàn diện với Hoa Kỳ (9/2023) đã mang lại kết quả cốt lõi nào?", "o": ["Xóa bỏ hoàn toàn thuế quan cho hàng nông sản Việt Nam.", "Bùng nổ hợp tác R&D, chuyển giao công nghệ và đưa Việt Nam vào chuỗi cung ứng bán dẫn toàn cầu.", "Hoa Kỳ cam kết cung cấp toàn bộ trang bị quốc phòng truyền thống cho Việt Nam.", "Chuyển đổi toàn bộ hệ thống năng lượng của Việt Nam sang năng lượng xanh trong 2 năm."], "c": 1}, {"q": "Khi vận dụng Ngoại giao Cây tre vào kỷ nguyên số, hành động thực tiễn nào được xác định là \"gốc vững\" để bảo vệ chủ quyền quốc gia?", "o": ["Cấm hoàn toàn các nền tảng mạng xã hội xuyên biên giới hoạt động tại Việt Nam.", "Đóng cửa hệ thống mạng internet quốc gia để xây dựng mạng nội bộ.", "Bảo vệ chủ quyền dữ liệu, an ninh mạng quốc gia và yêu cầu các nền tảng xuyên biên giới tuân thủ luật pháp sở tại.", "Giao phó toàn bộ hạ tầng dữ liệu cho các tập đoàn công nghệ toàn cầu quản lý. Gốc vững trong kỷ nguyên số chính là giữ vững an ninh dữ liệu trong khi \"cành uyển chuyển\" là việc đàm phán thu hút công nghệ cao"], "c": 2}, {"q": "Hình ảnh một \"Cây tre Việt Nam\" nhân văn, trách nhiệm trên trường quốc tế được hiện thực hóa sinh động qua hoạt động Gìn giữ Hòa bình tại Liên Hợp Quốc nhờ yếu tố đặc biệt nào?", "o": ["Cử hơn 1.100 lượt sĩ quan vận hành Bệnh viện dã chiến và Đội Công binh với tỷ lệ nữ sĩ quan đạt 13-16%, vượt xa tiêu chuẩn chung.", "Cung cấp vũ khí và khí tài quân sự miễn phí cho các phái bộ tại châu Phi.", "Trở thành quốc gia đóng góp ngân sách lớn nhất cho hoạt động gìn giữ hòa bình.", "Cử lực lượng tác chiến trực tiếp tham gia giải quyết xung đột vũ trang tại Trung Đông. Hành động này mang lại giá trị thực tiễn cao, giúp khẳng định uy tín \"mềm\" của ngoại giao Việt Nam"], "c": 0}, {"q": "Tại ASEAN, thực tiễn \"kiến tạo luật chơi\" và tạo \"lá chắn mềm\" của ngoại giao Việt Nam được thể hiện rõ nhất qua hành động nào?", "o": ["Yêu cầu loại bỏ các quốc gia không ủng hộ Việt Nam ra khỏi khối ASEAN.", "Đơn phương thiết lập các quy tắc thương mại mới áp dụng bắt buộc cho toàn khối.", "Chủ động đưa Hiệp ước Thân thiện và Hợp tác (TAC) thành quy tắc ứng xử chung và kiên trì đàm phán COC dựa trên UNCLOS 1982.", "Rút khỏi các cơ chế đa phương để tập trung đàm phán song phương với từng nước ASEAN. Thể hiện sự chủ động trong việc áp dụng luật pháp quốc tế để giải quyết tranh chấp và duy trì hòa bình khu vực"], "c": 2}, {"q": "Trong vai trò Chủ tịch ASEAN năm 2020, Việt Nam đã vận dụng năng lực \"kiến tạo luật chơi\" để giúp khối tránh bị đứt gãy liên kết thông qua sáng kiến thực tiễn nào?", "o": ["Đề xuất thành lập liên minh tiền tệ chung cho toàn khu vực Đông Nam Á.", "Dẫn dắt thiết lập quỹ ứng phó COVID-19 và kho dự phòng y tế cho ASEAN.", "Ký kết hiệp ước phòng thủ quân sự chung đối phó với khủng hoảng toàn cầu.", "Đình chỉ các hoạt động thương mại nội khối để tập trung chống dịch. Hành động này thể hiện khả năng dẫn dắt, linh hoạt thích ứng giúp ASEAN duy trì sự đoàn kết và vượt qua khủng hoảng y tế chưa từng có"], "c": 1}, {"q": "Câu 24: Trong bối cảnh cạnh tranh chiến lược gay gắt, việc duy trì thành công mô hình \"cân bằng có nguyên tắc\" giúp Việt Nam đạt được const COLORS = ["#E63946", "#E9C46A", "#2A9D8F", "#F4A261", "#457B9D"];
const TEAM_AVATARS = ['🦊','🐼','🐯','🐨','🦁'];

let teams = [];

let currentTeam = 0;
let phase = 'idle';
let pendingSteps = null, lastRoll = null;

let turnTransitionTimer = null;
let cardShuffleTimer = null;

function startGame(){
  teams=[];
  turnSnapshot=null;
  turnVersion=0;
  clearTimeout(turnTransitionTimer);
  clearTimeout(cardShuffleTimer);
  const diceReady=document.getElementById('diceReadyOverlay');
  if(diceReady) diceReady.classList.add('hidden');
  for(let i=0;i<5;i++) teams.push({name:'Đội '+(i+1),color:COLORS[i],avatar:TEAM_AVATARS[i],score:0,pos:0,finished:false});
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  renderBoard(); renderScoreboard();
  setTimeout(()=>document.getElementById('boardGrid').classList.add('show'), 60);
  beginTurn();
}

function turnTeamIdx(){ return qIndex % 5; }

const MAP_POINTS = [
  [90,560],[195,560],[300,560],[405,560],[510,560],[615,560],[720,560],[825,560],
  [845,450],[735,450],[625,450],[515,450],[405,450],[295,450],[185,450],[80,450],
  [95,340],[205,340],[315,340],[425,340],[535,340],[645,340],[755,340],[865,340],
  [840,230],[730,230],[620,230],[510,230],[400,230],[290,230],[180,230],[85,230],
  [110,115],[205,115],[300,115],[395,115],[490,115],[585,115],[680,115],[775,115],[865,115]
];

function renderBoard(){
  const grid=document.getElementById('boardGrid'); grid.innerHTML='';
  const pts=MAP_POINTS.map(([x,y])=>x+','+y).join(' ');
  grid.innerHTML='<svg class="route-svg" viewBox="0 0 1000 650" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline class="route-shadow" points="'+pts+'"></polyline>'+
    '<polyline class="route-main" points="'+pts+'"></polyline>'+
    '<polyline class="route-edge" points="'+pts+'"></polyline>'+
    '</svg>'+
    '<div class="map-stamp">VIỆT<br>NAM</div>'+
    '<div class="map-deco fan">🪭</div><div class="map-deco butterfly">🦋</div>';

  for(let p=0;p<=40;p++){
    const [x,y]=MAP_POINTS[p];
    const cell=document.createElement('div'); cell.className='cell'; cell.id='cell'+p;
    cell.style.left=(x/10)+'%'; cell.style.top=(y/6.5)+'%';
    // Tiny hand-made variation keeps the board organic without bending the path.
    const tilt=[-2,1,-1,2,-2,1,-1,2,1,-2,2,-1,1,-2,2,-1,-2,1,-1,2,-2,1,-1,2,2,-1,1,-2,2,-1,1,-2,-2,1,-1,2,-2,1,-1,2,-1][p];
    cell.style.setProperty('--tilt',tilt+'deg');
    if(p===0) cell.classList.add('start');
    if(p===40) cell.classList.add('finish');
    if(SQUARES[p]) cell.classList.add('special');
    const num=document.createElement('div'); num.className='num'; num.textContent=p; cell.appendChild(num);
    if(SQUARES[p]){ const ic=document.createElement('div'); ic.className='icon'; ic.textContent=SQUARES[p].i||'★'; cell.appendChild(ic); }
    else if(p===0){ cell.appendChild(document.createTextNode('START')); }
    else if(p===40){ cell.appendChild(document.createTextNode('ĐÍCH')); }
    else { /* clean regular square: number + team token only */ }
    const toks=document.createElement('div'); toks.className='tokens'; toks.id='toks'+p; cell.appendChild(toks);
    cell.style.zIndex=String(10+p%5);
    grid.appendChild(cell);
  }
  placeTokens();
}
function slotToPos(slot){
  return slot<=40?slot:null;
}
function placeTokens(){
  for(let p=0;p<=40;p++){const el=document.getElementById('toks'+p);if(el)el.innerHTML='';}
  teams.forEach((t,i)=>{
    const el=document.getElementById('toks'+t.pos);
    if(el){
      const d=document.createElement('div'); d.className='tok'; d.dataset.team=String(i+1); d.style.setProperty('--team-color',t.color); d.textContent=t.avatar; d.title=t.name; el.appendChild(d);
    }
  });
}

function renderScoreboard(){
  const el=document.getElementById('scoreboard'); el.innerHTML='';
  teams.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='team-row';
    row.innerHTML='<div class="team-avatar" style="--team-color:'+t.color+'">'+t.avatar+'</div><div class="name">'+t.name+
      (passport[i]?'<span class="badge">Hộ chiếu</span>':'')+'</div>'+
      '<div><span class="sc">'+t.score+'đ</span><div class="pos">ô '+t.pos+'</div></div>';
    el.appendChild(row);
  });
}

function toggleScoreboard(){ document.getElementById('scoreDrawer').classList.toggle('hidden'); }
function toggleQuestionView(){
  const qp=document.getElementById('qPanel'), rb=document.getElementById('reopenQBtn');
  qp.classList.toggle('hidden');
  rb.classList.toggle('hidden', !qp.classList.contains('hidden'));
}

function activeEffectsForTeam(i){
  const effects=[];
  if(doubleFlag[i]) effects.push({icon:'✦',name:'Nâng tầm vị thế',desc:'Câu trả lời đúng tiếp theo của đội nhận +20 điểm.'});
  if(immuneFlag[i]) effects.push({icon:'🛡️',name:'Quyền miễn trừ ngoại giao',desc:'Lần trả lời sai tiếp theo không bị trừ điểm và không bị cướp quyền.'});
  if(passport[i]) effects.push({icon:'🛂',name:'Hộ chiếu ngoại giao',desc:'Vô hiệu 1 lần hoán đổi vị trí hoặc điểm số nhắm vào đội.'});
  return effects;
}
function renderEffectsPanel(){
  const grid=document.getElementById('effectsGrid'); if(!grid) return;
  grid.innerHTML='';
  teams.forEach((t,i)=>{
    const effects=activeEffectsForTeam(i);
    const card=document.createElement('div'); card.className='effect-team';
    let html='<div class="effect-team-head"><div class="team-avatar" style="--team-color:'+t.color+'">'+t.avatar+'</div><div><b>'+t.name+'</b><div class="effects-sub" style="margin:0">Điểm '+t.score+' · ô '+t.pos+'</div></div></div><div class="effect-list">';
    if(!effects.length) html+='<div class="effect-none">Không có hiệu ứng đang chờ.</div>';
    effects.forEach(e=>{ html+='<div class="effect-chip"><div class="icon">'+e.icon+'</div><div><b>'+e.name+'</b><span>'+e.desc+'</span></div></div>'; });
    html+='</div>';
    card.innerHTML=html; grid.appendChild(card);
  });
}
function toggleEffectsPanel(){
  const overlay=document.getElementById('effectsOverlay');
  if(!overlay) return;
  const willShow=overlay.classList.contains('hidden');
  if(willShow){ renderEffectsPanel(); overlay.classList.remove('hidden'); }
  else overlay.classList.add('hidden');
}

/* ===== Turn flow ===== */

function captureTurnSnapshot(){
  turnSnapshot={
    qIndex, currentTeam,
    teams:teams.map(t=>({...t})),
    doubleFlag:[...doubleFlag], immuneFlag:[...immuneFlag], passport:[...passport],
    lastGain:[...lastGain]
  };
}

function restoreTurnSnapshot(){
  if(!turnSnapshot) return false;
  turnVersion++;
  clearTimeout(turnTransitionTimer);
  const transition=document.getElementById('turnTransition');
  if(transition) transition.classList.remove('show');
  const roundOverlay=document.getElementById('roundScoreOverlay');
  if(roundOverlay) roundOverlay.classList.add('hidden');
  const effectsOverlay=document.getElementById('effectsOverlay');
  if(effectsOverlay) effectsOverlay.classList.add('hidden');
  teams=turnSnapshot.teams.map(t=>({...t}));
  qIndex=turnSnapshot.qIndex;
  currentTeam=turnSnapshot.currentTeam;
  doubleFlag=[...turnSnapshot.doubleFlag];
  immuneFlag=[...turnSnapshot.immuneFlag];
  passport=[...turnSnapshot.passport];
  lastGain=[...turnSnapshot.lastGain];
  pendingSteps=null;
  lastRoll=null;
  stealPool=[];
  answerMode='main';
  answerLocked=false;
  phase='idle';
  closeModal();
  const diceOverlay=document.getElementById('diceOverlay');
  if(diceOverlay) diceOverlay.classList.add('hidden');
  const diceReady=document.getElementById('diceReadyOverlay');
  if(diceReady) diceReady.classList.add('hidden');
  clearTimeout(cardShuffleTimer);
  renderScoreboard();
  renderBoard();
  document.getElementById('qPanel').classList.add('hidden');
  document.getElementById('reopenQBtn').classList.add('hidden');
  beginTurn();
  return true;
}

function requestResetTurn(){
  if(!teams.length || !turnSnapshot) return;
  showModal('rui','Reset lượt?', 'Lượt hiện tại sẽ quay về trạng thái ngay trước khi bắt đầu lượt này. Các thay đổi của lượt hiện tại sẽ bị hoàn tác.',[
    {label:'↺ Reset lượt', cls:'btn-red', cb:()=>{ restoreTurnSnapshot(); }},
    {label:'Hủy', cls:'btn-outline', cb:()=>closeModal()}
  ]);
}
function showTurnTransition(teamIdx, after){
  const overlay=document.getElementById('turnTransition');
  if(!overlay || !teams[teamIdx]) { after(); return; }
  const version=turnVersion;
  const avatar=document.getElementById('turnTransitionAvatar');
  const title=document.getElementById('turnTransitionTitle');
  const sub=document.getElementById('turnTransitionSub');
  avatar.textContent=teams[teamIdx].avatar;
  title.textContent=teams[teamIdx].name.toUpperCase();
  sub.textContent='Câu hỏi '+(qIndex+1)+'/30';
  clearTimeout(turnTransitionTimer);
  overlay.classList.add('show');
  turnTransitionTimer=setTimeout(()=>{
    if(version!==turnVersion) return;
    overlay.classList.remove('show');
    after();
  },2200);
}

function beginTurn(){
  if(qIndex>=30) return endGame();
  turnVersion++;
  const ti=turnTeamIdx(); currentTeam=ti;
  captureTurnSnapshot();
  document.getElementById('progressMeta').textContent='Câu '+(qIndex+1)+'/30';
  document.getElementById('qPanel').classList.add('hidden');
  document.getElementById('reopenQBtn').classList.add('hidden');
  document.getElementById('scoreDrawer').classList.add('hidden');
  document.getElementById('effectsOverlay').classList.add('hidden');
  const already=teams[ti].finished;
  showTurnTransition(ti,()=>{
    if(teams[ti] && teams[ti].finished){
      pendingSteps=0; phase='question'; showQuestionPhase('main'); renderDock();
    }else{
      goDicePhaseMain(false);
    }
  });
}
function showDiceReady(cb){
  const overlay=document.getElementById('diceReadyOverlay');
  const inner=document.getElementById('diceReadyInner');
  if(!overlay || !inner){ cb(); return; }
  const version=turnVersion;
  overlay.classList.remove('hidden');
  const fire=()=>{
    if(version!==turnVersion) return;
    overlay.classList.add('hidden');
    inner.onclick=null;
    inner.onkeydown=null;
    rollDiceAnimate(cb);
  };
  inner.onclick=fire;
  inner.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(); } };
}
function goDicePhaseMain(autoRoll=false){
  phase='dice';
  const version=turnVersion;
  diceCallback=(roll,steps)=>{
    if(version!==turnVersion) return;
    lastRoll=roll; pendingSteps=steps; phase='question'; showQuestionPhase('main'); renderDock();
  };
  renderDock();
  if(autoRoll) showDiceReady(diceCallback);
  else showDiceReady(diceCallback);
}
function goDicePhaseSteal(ti){
  currentTeam=ti;
  phase='dice';
  const version=turnVersion;
  diceCallback=(roll,steps)=>{
    if(version!==turnVersion) return;
    animateMove(ti, steps, version);
  };
  renderDock();
  showDiceReady(diceCallback);
}
function renderDock(){
  const dock=document.getElementById('dock');
  dock.classList.remove('end-ready');
  if(phase==='dice'){
    dock.innerHTML='';
  } else if(phase==='moving'){
    dock.innerHTML='<div class="dock-msg">🐾 Đang di chuyển…</div>';
  } else if(phase==='endTurnReady'){
    dock.classList.add('end-ready');
    dock.innerHTML='<button class="btn btn-gold dock-action" onclick="endTurn()">➡ Sang lượt tiếp theo</button>';
  } else if(phase==='question'){
    dock.innerHTML = pendingSteps ? '<div class="dock-msg">🎲 '+lastRoll+' → '+pendingSteps+' ô</div>' : '<div class="dock-msg">🏁 Đã về đích</div>';
  } else { dock.innerHTML=''; }
}
function pipsHTML(n){
  const patterns={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const on=patterns[n]; let html='';
  for(let i=0;i<9;i++) html+='<div class="dice-pip'+(on.includes(i)?' on':'')+'"></div>';
  return html;
}
function buildCube(targetId='cube3d'){
  const cube=document.getElementById(targetId); if(!cube) return;
  const faceMap=[[1,'f1'],[6,'f6'],[3,'f3'],[4,'f4'],[5,'f5'],[2,'f2']];
  cube.innerHTML=faceMap.map(([n,cls])=>'<div class="face '+cls+'">'+pipsHTML(n)+'</div>').join('');
}
const SHOW_ROT={1:{x:0,y:0},6:{x:0,y:180},3:{x:0,y:-90},4:{x:0,y:90},5:{x:-90,y:0},2:{x:90,y:0}};
function rollDiceAnimate(cb){
  const version=turnVersion;
  const overlay=document.getElementById('diceOverlay'); overlay.classList.remove('hidden');
  const cube=document.getElementById('cube3d'); const resultEl=document.getElementById('diceResult');
  resultEl.textContent='';
  cube.style.transition='none'; cube.style.transform='rotateX(0deg) rotateY(0deg)';
  void cube.offsetWidth;
  const roll=1+Math.floor(Math.random()*6);
  const steps= roll<=2?1:(roll<=4?2:3);
  const base=SHOW_ROT[roll];
  const spinX=base.x+360*(2+Math.floor(Math.random()*2));
  const spinY=base.y+360*(3+Math.floor(Math.random()*2));
  requestAnimationFrame(()=>{
    cube.style.transition='transform 1.05s cubic-bezier(.2,.7,.3,1)';
    cube.style.transform='rotateX('+spinX+'deg) rotateY('+spinY+'deg)';
  });
  setTimeout(()=>{
    if(version!==turnVersion) return;
    resultEl.textContent='Ra '+roll+' → di chuyển '+steps+' ô';
    setTimeout(()=>{
      if(version!==turnVersion) return;
      overlay.classList.add('hidden'); cb(roll,steps);
    },850);
  },1100);
}
buildCube('cube3d');
buildCube('readyCube');

function showQuestionPhase(mode='main'){
  answerMode=mode;
  answerLocked=false;
  const q=Q[qIndex], ti=currentTeam;
  document.getElementById('turnLabel').textContent=(mode==='steal'?'Quyền trả lời của ':'Lượt của ')+teams[ti].name;
  document.getElementById('qtext').textContent='Câu '+(qIndex+1)+': '+q.q;
  const opts=document.getElementById('opts'); opts.innerHTML=''; opts.classList.remove('locked');
  const labs=['A','B','C','D'];
  q.o.forEach((o,i)=>{
    const d=document.createElement('div'); d.className='opt'; d.id='opt'+i;
    d.innerHTML='<span class="lab">'+labs[i]+'.</span>'+o;
    d.onclick=()=>pickAnswer(i);
    opts.appendChild(d);
  });
  document.getElementById('mainControls').innerHTML='<p class="controls">Chọn đáp án mà đội đang có quyền trả lời.</p>';
  document.getElementById('stealZone').innerHTML='';
  document.getElementById('qPanel').classList.remove('hidden');
  document.getElementById('reopenQBtn').classList.add('hidden');
}
function pickAnswer(i){
  const opts=document.getElementById('opts');
  if(answerLocked || opts.classList.contains('locked')) return;
  answerLocked=true;
  opts.classList.add('locked');
  const q=Q[qIndex];
  const picked=document.getElementById('opt'+i);
  if(i!==q.c){
    // Wrong answer: only mark the selected option red. Do not reveal the correct one.
    picked.classList.add('wrong-pick');
  }else{
    picked.classList.add('correct-reveal');
  }
  setTimeout(()=>{
    if(answerMode==='steal') answerSteal(i===q.c);
    else answerMain(i===q.c);
  },650);
}

function answerMain(correct){
  const ti=currentTeam, t=teams[ti];
  document.getElementById('mainControls').classList.add('hidden');
  if(correct){
    // Hide the question panel immediately so the route and moving token stay visible.
    document.getElementById('qPanel').classList.add('hidden');
    document.getElementById('reopenQBtn').classList.remove('hidden');
    const gain=doubleFlag[ti]?20:10; doubleFlag[ti]=false;
    t.score+=gain; lastGain[ti]=gain; renderScoreboard();
    startCardDraw(ti, ()=>{
      if(teams[ti].finished){ finishTurnReady(); }
      else { phase='moving'; renderDock(); animateMove(ti, pendingSteps); }
    });
  }else{
    if(immuneFlag[ti]){
      immuneFlag[ti]=false;
      showModal('dac','Miễn trừ áp dụng',t.name+' dùng <b>Quyền miễn trừ ngoại giao</b> — không bị trừ điểm, đứng yên.',[
        {label:'Tiếp tục',cls:'btn-gold',cb:()=>{closeModal();finishTurnReady();}}
      ]);
    }else{
      t.score-=5; renderScoreboard();
      openSteal(ti);
    }
  }
}

function openSteal(wrongIdx){
  stealPool=teams.map((_,i)=>i).filter(i=>i!==wrongIdx && !teams[i].finished);
  const zone=document.getElementById('stealZone');
  zone.innerHTML='<p class="small" style="margin:8px 0 4px;">Mở cướp quyền — chọn đội giành quyền trả lời:</p><div class="steal-list" id="stealList"></div>';
  // Keep the original wrong choice visible, but lock the answer choices until a team claims the turn.
  renderStealList();
}
function renderStealList(){
  const list=document.getElementById('stealList'); if(!list) return;
  list.innerHTML='';
  if(stealPool.length===0){
    list.innerHTML='<span class="small">Không còn đội nào cướp quyền — bỏ qua câu này.</span><br>';
    const btn=document.createElement('button'); btn.className='btn btn-gold'; btn.style.marginTop='8px'; btn.textContent='Tiếp tục';
    btn.onclick=finishTurnReady; list.appendChild(btn); return;
  }
  stealPool.forEach(i=>{
    const p=document.createElement('button'); p.type='button'; p.className='pill';
    p.innerHTML=teams[i].avatar+' '+teams[i].name;
    p.onclick=()=>stealResult(i); list.appendChild(p);
  });
}
function stealResult(idx){
  if(!stealPool.includes(idx)) return;
  turnVersion++;
  currentTeam=idx;
  answerMode='steal';
  document.getElementById('qPanel').classList.add('hidden');
  document.getElementById('reopenQBtn').classList.add('hidden');
  document.getElementById('stealZone').innerHTML='';
  answerLocked=false;
  showTurnTransition(idx,()=>showQuestionPhase('steal'));
}
function answerSteal(correct){
  const ti=currentTeam, t=teams[ti];
  document.getElementById('mainControls').classList.add('hidden');
  if(correct){
    // Hide the question panel immediately so the route and moving token stay visible.
    document.getElementById('qPanel').classList.add('hidden');
    document.getElementById('reopenQBtn').classList.remove('hidden');
    const gain=doubleFlag[ti]?20:10; doubleFlag[ti]=false;
    t.score+=gain; lastGain[ti]=gain; renderScoreboard();
    stealPool=[];
    startCardDraw(ti, ()=>{
      if(teams[ti].finished){ finishTurnReady(); }
      else { goDicePhaseSteal(ti); }
    });
  }else{
    if(immuneFlag[ti]){
      immuneFlag[ti]=false;
      t.score+=0;
      stealPool=stealPool.filter(i=>i!==ti);
      showModal('dac','Miễn trừ áp dụng',t.name+' dùng <b>Quyền miễn trừ ngoại giao</b> — không bị trừ điểm và mất quyền trả lời.',[
        {label:'Tiếp tục',cls:'btn-gold',cb:()=>{closeModal();reopenStealOptions();}}
      ]);
    }else{
      t.score-=5; renderScoreboard();
      stealPool=stealPool.filter(i=>i!==ti);
      reopenStealOptions();
    }
  }
}
function reopenStealOptions(){
  answerMode='main';
  answerLocked=true;
  const opts=document.getElementById('opts');
  opts.classList.add('locked');
  document.getElementById('mainControls').classList.add('hidden');
  document.getElementById('turnLabel').textContent='Chọn đội giành quyền trả lời';
  const zone=document.getElementById('stealZone');
  zone.innerHTML='<p class="small" style="margin:8px 0 4px;">Chọn đội tiếp theo giành quyền trả lời:</p><div class="steal-list" id="stealList"></div>';
  renderStealList();
}

/* ===== Card draw ===== */
function startCardDraw(ti, done){
  clearTimeout(cardShuffleTimer);
  const root=document.getElementById('modalRoot');
  root.innerHTML='<div class="overlay"><div class="modal">'+
    '<div class="card-stack shuffle" id="cardStack">'+
      '<div class="card-back c1"></div><div class="card-back c2"></div><div class="card-back c3"></div>'+
      '<div class="card-back c4"></div><div class="card-back c5"></div>'+
    '</div><h2>Xào bài ngoại giao</h2>'+
    '<p id="shuffleHint">Xấp thẻ đang được xáo đều…</p>'+
    '<div class="modal-actions"><button class="btn btn-gold" id="drawBtn" disabled>Rút thẻ</button></div></div></div>';
  const btn=document.getElementById('drawBtn');
  cardShuffleTimer=setTimeout(()=>{
    const stack=document.getElementById('cardStack');
    if(!stack || !btn) return;
    stack.classList.remove('shuffle'); stack.classList.add('ready');
    document.getElementById('shuffleHint').textContent='Sẵn sàng — bấm để rút thẻ.';
    btn.disabled=false;
    btn.onclick=()=>revealCard(ti, done);
  },2400);
}
function revealCard(ti, done){
  const deck=CARDS.concat(Array(4).fill({n:'Công hàm ngoại giao',t:'trang',d:'Không có hiệu ứng gì — chỉ là thủ tục ngoại giao thông thường.',fx:'blank'}));
  const card=deck[Math.floor(Math.random()*deck.length)];
  showModal(card.t, card.n, card.d, [
    {label:'Áp dụng', cls:'btn-gold', cb:()=>{ closeModal(); applyCard(ti, card, done); }}
  ]);
}
function applyCard(idx, card, done){
  const t=teams[idx];
  switch(card.fx){
    case 'add15': t.score+=15; break;
    case 'fwd2': t.pos=Math.min(40,t.pos+2); break;
    case 'double': doubleFlag[idx]=true; break;
    case 'immune': immuneFlag[idx]=true; break;
    case 'loseJust': t.score-=lastGain[idx]||0; break;
    case 'swapPos': return chooseTarget(idx, (j)=>{ const p=t.pos; t.pos=teams[j].pos; teams[j].pos=p; renderScoreboard(); placeTokens(); done(); }, 'pos');
    case 'swapScore': return chooseTarget(idx, (j)=>{ const s=t.score; t.score=teams[j].score; teams[j].score=s; renderScoreboard(); done(); }, 'score');
    case 'giveLowest': { let low=0; teams.forEach((tt,i)=>{ if(tt.score<teams[low].score) low=i; }); if(low!==idx){ teams[low].score+=15; t.score-=15; } break; }
    case 'passport': passport[idx]=true; break;
    case 'blank': break;
  }
  renderScoreboard(); placeTokens(); done();
}
function chooseTarget(fromIdx, cb, kind){
  const others=teams.map((_,i)=>i).filter(i=>i!==fromIdx);
  const buttons=others.map(i=>({
    label: teams[i].name+(passport[i]?' 🛂':''), cls:'btn-outline',
    cb:()=>{
      if(passport[i]){
        closeModal();
        showModal('dac','Hộ chiếu ngoại giao', 'Đội '+teams[i].name+' đang giữ Hộ chiếu ngoại giao. Có dùng để vô hiệu hoán đổi không?',[
          {label:'Dùng hộ chiếu (vô hiệu)', cls:'btn-red', cb:()=>{ passport[i]=false; renderScoreboard(); closeModal(); }},
          {label:'Không dùng — hoán đổi', cls:'btn-green', cb:()=>{ closeModal(); cb(i); }}
        ]);
      } else { closeModal(); cb(i); }
    }
  }));
  showModal('rui','Chọn đội mục tiêu', 'Chọn đội để hoán đổi '+(kind==='pos'?'vị trí':'điểm tích lũy')+':', buttons);
}

/* ===== Movement & squares ===== */
function animateMove(ti, steps, version=turnVersion){
  phase='moving'; renderDock();
  const t=teams[ti]; let remaining=steps;
  function step(){
    if(version!==turnVersion) return;
    if(remaining<=0) return afterMoveComplete(ti,version);
    t.pos=Math.min(40,t.pos+1); remaining--; placeTokens(); renderScoreboard();
    if(t.pos>=40) return afterMoveComplete(ti,version);
    setTimeout(step,320);
  }
  setTimeout(step,320);
}
function afterMoveComplete(ti,version=turnVersion){
  if(version!==turnVersion) return;

  const t=teams[ti];
  if(t.pos===40 && !t.finished){
    t.finished=true; t.score+=10; renderScoreboard();
    showModal('loi','Về đích!', 'Đội '+t.name+' cán đích ô 40, nhận thêm +10 điểm thưởng về đích!',[
      {label:'Tiếp tục', cls:'btn-gold', cb:()=>{ if(version!==turnVersion) return; closeModal(); afterFinishCheck(ti); }}
    ]);
    return;
  }
  afterFinishCheck(ti);
}
function afterFinishCheck(ti){
  const t=teams[ti];
  if(SQUARES[t.pos]) applySquareEffect(ti, SQUARES[t.pos], finishTurnReady);
  else finishTurnReady();
}
function applySquareEffect(idx, sq, done){
  const t=teams[idx]; let extra=null;
  switch(sq.fx){
    case 'add5': t.score+=5; break;
    case 'sub5': t.score-=5; break;
    case 'back3': t.pos=Math.max(0,t.pos-3); break;
    case 'fwd3': t.pos=Math.min(40,t.pos+3); break;
    case 'freecard': extra='freecard'; break;
    case 'swapLeader': { let leader=0; teams.forEach((tt,i)=>{ if(tt.pos>teams[leader].pos) leader=i; });
      if(leader!==idx){ const p=t.pos; t.pos=teams[leader].pos; teams[leader].pos=p; } break; }
  }
  renderScoreboard(); placeTokens();
  showModal('dac','Ô '+t.pos+': '+sq.n, sq.d,[
    {label:'Tiếp tục', cls:'btn-gold', cb:()=>{ closeModal(); if(extra==='freecard'){ startCardDraw(idx, done); } else { done(); } }}
  ]);
}
function finishTurnReady(){ phase='endTurnReady'; renderDock(); }
function renderRoundScore(){
  const list=document.getElementById('roundScoreList'); if(!list) return;
  const round=Math.floor(qIndex/5);
  document.getElementById('roundScoreTitle').textContent='Kết quả sau lượt '+round;
  document.getElementById('roundScoreSub').textContent='5 đội đã hoàn thành lượt chơi. Kiểm tra bảng điểm trước khi sang lượt tiếp theo.';
  const rows=teams.map((t,i)=>({t,i})).sort((a,b)=>b.t.score-a.t.score || b.t.pos-a.t.pos);
  list.innerHTML='';
  rows.forEach((item,rank)=>{
    const {t,i}=item;
    const row=document.createElement('div'); row.className='round-score-row';
    row.innerHTML='<div class="place">'+(rank+1)+'</div>'+
      '<div class="team-avatar" style="--team-color:'+t.color+'">'+t.avatar+'</div>'+
      '<div class="team-main"><div class="team-name">'+t.name+'</div><div class="team-detail">Điểm tích lũy '+t.score+' · ô '+t.pos+'</div></div>'+
      '<div class="team-score">'+t.score+'đ</div>';
    list.appendChild(row);
  });
}
function showRoundScore(){
  renderRoundScore();
  document.getElementById('roundScoreOverlay').classList.remove('hidden');
}
function closeRoundScoreAndContinue(){
  document.getElementById('roundScoreOverlay').classList.add('hidden');
  beginTurn();
}
function endTurn(){
  qIndex++; pendingSteps=null; lastRoll=null; stealPool=[];
  // Every 5 questions = one full round across the 5 teams. Show the large score board first.
  if(qIndex<30 && qIndex%5===0){
    showRoundScore();
  }else{
    beginTurn();
  }
}

/* ===== Modal helper ===== */
function showModal(type,title,desc,actions){
  const root=document.getElementById('modalRoot');
  const tagName={loi:'CƠ HỘI',rui:'RỦI RO',dac:'ĐẶC BIỆT',trang:'THẺ TRẮNG'}[type]||'';
  const tagHtml=tagName?'<div class="tag '+type+'">'+tagName+'</div>':'';
  let btns=''; actions.forEach((a,i)=>{ btns+='<button class="btn '+a.cls+'" id="modalBtn'+i+'">'+a.label+'</button>'; });
  root.innerHTML='<div class="overlay"><div class="modal">'+tagHtml+'<h2>'+title+'</h2><p>'+desc+'</p><div class="modal-actions">'+btns+'</div></div></div>';
  actions.forEach((a,i)=>{ document.getElementById('modalBtn'+i).onclick=a.cb; });
}
function closeModal(){ clearTimeout(cardShuffleTimer); document.getElementById('modalRoot').innerHTML=''; }

function endGame(){
  clearTimeout(turnTransitionTimer);
  const transition=document.getElementById('turnTransition');
  if(transition) transition.classList.remove('show');
  const roundOverlay=document.getElementById('roundScoreOverlay');
  if(roundOverlay) roundOverlay.classList.add('hidden');
  const effectsOverlay=document.getElementById('effectsOverlay');
  if(effectsOverlay) effectsOverlay.classList.add('hidden');
  const diceReady=document.getElementById('diceReadyOverlay');
  if(diceReady) diceReady.classList.add('hidden');
  clearTimeout(cardShuffleTimer);
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  const ranked=teams.map(t=>({...t,total:t.score+t.pos*2})).sort((a,b)=> b.total-a.total || b.score-a.score);
  const list=document.getElementById('rankList'); list.innerHTML='';
  ranked.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='rank-row';
    row.innerHTML='<div class="place">#'+(i+1)+'</div><div class="dot" style="background:'+t.color+'"></div>'+
      '<div style="flex:1;"><b>'+t.name+'</b><div class="small">Điểm tích lũy '+t.score+' + vị trí '+t.pos+'×2</div></div>'+
      '<div class="sc" style="font-size:20px;color:var(--gold-l);font-family:\'Baloo 2\';">'+t.total+'đ</div>';
    list.appendChild(row);
  });
}
</script>
